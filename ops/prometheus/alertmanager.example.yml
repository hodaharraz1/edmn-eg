# PKG-INFRA-01 — the two receivers the brief asks for: email and Telegram.
# Fill the placeholders from the server's secret store; never commit real values.
route:
  receiver: email-ops
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: telegram-ops
      continue: true
receivers:
  - name: email-ops
    email_configs:
      - to: REPLACE_WITH_OPS_EMAIL
        from: alerts@edmneg.com
        smarthost: REPLACE_WITH_SMTP_HOST:587
        auth_username: REPLACE_WITH_SMTP_USER
        auth_password_file: /etc/alertmanager/smtp_password
        require_tls: true
  - name: telegram-ops
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: REPLACE_WITH_CHAT_ID
        send_resolved: true
