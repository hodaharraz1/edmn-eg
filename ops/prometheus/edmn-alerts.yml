# PKG-INFRA-01 — alert rules for the single-server production stack.
# Load with `rule_files: [/etc/prometheus/edmn-alerts.yml]` and route Alertmanager to email/Telegram
# (ops/prometheus/alertmanager.example.yml shows the two receivers the brief asks for).
groups:
  - name: edmn-availability
    rules:
      - alert: EdmnDown
        expr: up{job="edmn"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "EDMN web is not answering", description: "No scrape for 2 minutes on {{ $labels.instance }}" }
      - alert: EdmnNotReady
        expr: edmn_ready == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Readiness failing", description: "Database / migrations / storage check is failing" }
      - alert: EdmnErrorRateHigh
        expr: sum(rate(edmn_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(edmn_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "5xx above 2% for 10 minutes" }
      - alert: EdmnLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(edmn_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 above 1.5 s" }
  - name: edmn-money
    rules:
      - alert: EdmnLedgerUnhealthy
        expr: edmn_ledger_health_ok == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Ledger health is not OK — money movements are blocked (fail closed)" }
      - alert: EdmnLedgerCheckStale
        expr: edmn_ledger_check_age_minutes > 60
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "No ledger:check result in over an hour" }
  - name: edmn-jobs
    rules:
      - alert: EdmnQueueStalled
        expr: edmn_jobs_oldest_pending_minutes > 15
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Oldest pending job is older than 15 minutes — is the worker running?" }
      - alert: EdmnJobsFailing
        expr: increase(edmn_jobs_failed[15m]) > 5
        labels: { severity: warning }
        annotations: { summary: "More than 5 jobs failed in 15 minutes" }
  - name: edmn-host
    rules:
      - alert: EdmnDiskFilling
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Less than 15% disk left" }
      - alert: EdmnBackupFailed
        expr: time() - edmn_backup_last_success_timestamp_seconds > 36 * 3600
        labels: { severity: critical }
        annotations: { summary: "No successful backup in 36 hours" }
