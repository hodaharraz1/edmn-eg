# EDMN CI gates (Batch 2). Runs on pull requests and on demand — never deploys, never touches staging/production.
# Secrets used here are throwaway test values generated per run; no production secret ever enters CI.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edmn
          POSTGRES_PASSWORD: edmn
          POSTGRES_DB: edmn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edmn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://edmn:edmn@localhost:5432/edmn_test
      DATABASE_URL: postgresql://edmn:edmn@localhost:5432/edmn_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Throwaway test secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - name: Secret leak scan (tree + history, prints locations only)
        run: npx tsx scripts/secret-scan.ts && npx tsx scripts/secret-scan.ts --history
