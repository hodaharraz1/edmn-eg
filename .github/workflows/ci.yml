# EDMN CI gates (Batch 2). Runs on pull requests and on demand — never deploys, never touches staging/production.
# Secrets used here are throwaway test values generated per run; no production secret ever enters CI.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edmn
          POSTGRES_PASSWORD: edmn
          POSTGRES_DB: edmn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edmn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://edmn:edmn@localhost:5432/edmn_test
      DATABASE_URL: postgresql://edmn:edmn@localhost:5432/edmn_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Throwaway test secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - name: Secret leak scan (tree + history, prints locations only)
        run: npx tsx scripts/secret-scan.ts && npx tsx scripts/secret-scan.ts --history
      - name: Dependency audit (production dependencies; high or critical blocks the merge)
        run: npm audit --omit=dev --audit-level=high
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [packages/edmn_core, packages/edmn_api, packages/edmn_design, apps/customer_mobile, apps/admin_mobile]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
