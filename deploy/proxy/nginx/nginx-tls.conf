# EDMN — TLS settings included by deploy/proxy/nginx/edmn.conf (install as /etc/edmn/nginx-tls.conf).
# Scoped to the EDMN server blocks only (included per server, never in the http{} block), so other virtual hosts
# on this server keep their own TLS settings.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:edmn_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
