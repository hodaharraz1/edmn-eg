# EDMN — proxy settings shared by the limited locations in deploy/proxy/nginx/edmn.conf
# (install as /etc/edmn/nginx-proxy-common.conf next to nginx-tls.conf).
# Same contract as the catch-all location: the app sees the real client address and trusts it only because this
# proxy is its sole client (TRUSTED_PROXY=true), and it never sees a client-supplied forwarding header.
proxy_pass http://edmn_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
