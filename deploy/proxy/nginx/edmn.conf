# EDMN — nginx reverse proxy TEMPLATE (www.edmneg.com, edmneg.com, admin.edmneg.com → 127.0.0.1:3000).
#
# ═══ LEGACY-SAFE BOUNDARIES — read before installing ═══════════════════════════════════════════════════════════
#  • This file declares ONLY the three EDMN names below. It contains NO `default_server`, NO `server_name _`,
#    NO wildcard (*.edmneg.com) and NO regex server_name, so it can never capture api.edmneg.com, mail.*,
#    webmail.*, cpanel.* or any other existing virtual host.
#  • api.edmneg.com is NOT configured here and must keep its current server block untouched.
#  • Install as its own, LAST-loaded file (see GUARD below). Do not edit or replace any existing file. Run `nginx -t` BEFORE `systemctl reload nginx`; on any error remove the symlink.
#  • On a cPanel/WHM server nginx is usually NOT the front proxy (Apache/LiteSpeed or ea-nginx is). Use the Apache
#    template there instead — never install a second web server competing for :80/:443.
#  • Rollback: remove this file (or its symlink), `nginx -t && systemctl reload nginx`. Nothing else changes.
#
# Certificates: Let's Encrypt (docs/runbooks/SELF_HOSTED_DEPLOYMENT.md §TLS). Until they exist, install ONLY the
# port-80 blocks (ACME + redirect) — nginx refuses to load a server block whose certificate files are missing.
#
# Headers: the application already sets Content-Security-Policy, Strict-Transport-Security, X-Frame-Options,
# X-Content-Type-Options, Referrer-Policy and Permissions-Policy. They are NOT repeated here (duplicates conflict).
# HSTS SAFETY: the app's HSTS carries includeSubDomains. Sent from www.edmneg.com / admin.edmneg.com it only covers
# *.www / *.admin (harmless). It must NEVER be sent from the apex edmneg.com — that would force https on
# api.edmneg.com, mail.*, webmail.* for two years. Therefore the apex is answered HERE with a plain 301 and is
# NEVER proxied to the application, and this file adds no HSTS header of its own. Do not submit to the preload list.
# Live messaging uses polling (no WebSocket/SSE), so no Upgrade handling or long read timeouts are needed.

# ── GUARD: implicit-default protection ──────────────────────────────────────────────────────────────────────────
# nginx sends a request whose Host matches no server_name to the port's default server: the one marked
# default_server, else the FIRST server block for that port in the whole configuration. These two blocks come first
# in this file so that, if this file were ever loaded before every legacy site AND the legacy config had no explicit
# default_server, an unknown host (e.g. api.edmneg.com served "by default") is REFUSED — never redirected to or
# served by EDMN. They match no real name. deploy/scripts/preflight-legacy.sh STOPS when the legacy nginx has no
# explicit default_server on 80/443, so in practice the legacy default keeps answering exactly as before.
# Install as the LAST-loaded file (e.g. /etc/nginx/sites-enabled/zz-edmn.conf on Debian/Ubuntu, where sites-enabled
# is included after conf.d; /etc/nginx/conf.d/zz-edmn.conf on RHEL-family) and compare `nginx -T` before/after.
server {
    listen 80;
    listen [::]:80;
    server_name edmn-guard.invalid;
    return 444;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name edmn-guard.invalid;
    ssl_reject_handshake on;
}

upstream edmn_app {
    server 127.0.0.1:3000;     # web container, published on loopback only (EDMN_WEB_PORT)
    keepalive 16;
}

# ── port 80: ACME http-01 + redirect to https (EDMN names only) ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.edmneg.com edmneg.com admin.edmneg.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;          # certbot --webroot -w /var/www/letsencrypt
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── apex → www (https). Answered by nginx itself — NEVER proxied to the app (HSTS includeSubDomains) ─────────────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edmneg.com;
    ssl_certificate     /etc/letsencrypt/live/www.edmneg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.edmneg.com/privkey.pem;
    include /etc/edmn/nginx-tls.conf;
    return 301 https://www.edmneg.com$request_uri;
}

# ── www + admin → application ──────────────────────────────────────────────────────────────────────────────────
# One block for both names: the application itself enforces the admin host (ENFORCE_ADMIN_HOST=true) and redirects
# /admin on www to admin.edmneg.com, so the proxy stays dumb and identical for both.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.edmneg.com admin.edmneg.com;

    # One certificate covering www.edmneg.com, edmneg.com and admin.edmneg.com (SAN), or split per name.
    ssl_certificate     /etc/letsencrypt/live/www.edmneg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.edmneg.com/privkey.pem;
    include /etc/edmn/nginx-tls.conf;

    # Uploads: the app accepts images ≤ 8 MB and documents ≤ 10 MB (UPLOAD_MAX_*_MB); keep a margin for multipart.
    client_max_body_size 12m;
    client_body_timeout 120s;
    # Request bodies are streamed to the app (no full buffering on disk for large uploads).
    proxy_request_buffering off;

    access_log /var/log/nginx/edmn.access.log;
    error_log  /var/log/nginx/edmn.error.log warn;

    location / {
        proxy_pass http://edmn_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (not append): the app trusts these only because this proxy is its sole client (TRUSTED_PROXY).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering on;
    }

    # Defence in depth: the scheduler endpoint is only for the local watchdog (127.0.0.1:3000 directly).
    location = /api/cron/tick {
        return 404;
    }
}
