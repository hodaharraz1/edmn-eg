# EDMN — Apache httpd reverse proxy TEMPLATE (www.edmneg.com, edmneg.com, admin.edmneg.com → 127.0.0.1:3000).
#
# ═══ LEGACY-SAFE BOUNDARIES — read before installing ═══════════════════════════════════════════════════════════
#  • Declares ONLY these three names. NO `ServerAlias *.edmneg.com`, NO `_default_`, NO catch-all VirtualHost, so it
#    can never capture api.edmneg.com, mail.*, webmail.*, cpanel.* or any other existing site.
#  • api.edmneg.com is NOT configured here; its current VirtualHost stays exactly as it is.
#  • Requires mod_proxy, mod_proxy_http, mod_headers, mod_ssl, mod_rewrite (already present on cPanel EasyApache 4).
#  • Run `apachectl configtest` (cPanel: `/usr/local/cpanel/scripts/rebuildhttpdconf --dry-run` is not available,
#    so use `httpd -t`) BEFORE any graceful restart. Rollback = remove the file/include, test, graceful restart.
#
# ═══ cPanel / WHM servers ═════════════════════════════════════════════════════════════════════════════════════
#  • NEVER edit /etc/apache2/conf/httpd.conf (cPanel regenerates it). cPanel-supported places are the per-vhost
#    include directories, e.g. (EasyApache 4):
#        /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel-user>/www.edmneg.com/edmn-proxy.conf
#        /etc/apache2/conf.d/userdata/std/2_4/<cpanel-user>/www.edmneg.com/edmn-proxy.conf
#    then `/usr/local/cpanel/scripts/rebuildhttpdconf && /scripts/restartsrv_httpd --graceful`.
#    In that mode use ONLY the "inside the VirtualHost" directives (section B) — cPanel owns the VirtualHost,
#    the certificate (AutoSSL) and the http→https redirect. Whether www/admin/apex are cPanel domains at all is a
#    KNTABO question; if the domain is not on this cPanel account, use section A on a non-cPanel Apache only.
#  • If a document root for www.edmneg.com exists today (legacy site), proxying replaces what the public sees on
#    www ONLY — files are not deleted. Coordinate with the DNS cutover runbook; do not do it before approval.
#
# Headers: the application sets CSP, HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy and
# Permissions-Policy itself — not repeated here. HSTS SAFETY: the app's HSTS has includeSubDomains, so the apex
# edmneg.com is redirected by Apache itself and NEVER proxied to the application (that would force https on
# api.edmneg.com and the mail hosts). No HSTS header is added here.

# ───────────────────────── A. Standalone (non-cPanel) Apache: full virtual hosts ─────────────────────────
<VirtualHost *:80>
    ServerName www.edmneg.com
    ServerAlias edmneg.com admin.edmneg.com
    # ACME http-01 (certbot --webroot -w /var/www/letsencrypt) stays on http; everything else → https.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName edmneg.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/www.edmneg.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.edmneg.com/privkey.pem
    # Apex answered here, never proxied (see HSTS SAFETY).
    Redirect permanent / https://www.edmneg.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.edmneg.com
    ServerAlias admin.edmneg.com
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    /etc/letsencrypt/live/www.edmneg.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.edmneg.com/privkey.pem
    ErrorLog  logs/edmn-error.log
    CustomLog logs/edmn-access.log combined

    # ── B. Directives that also go INSIDE a cPanel-managed VirtualHost (userdata include) ──
    ProxyRequests Off
    ProxyPreserveHost On
    # Uploads: app max 10 MB documents / 8 MB images → 12 MB body limit; generous upload timeout.
    LimitRequestBody 12582912
    ProxyTimeout 120
    # Forwarding headers: client copies are discarded; mod_proxy (ProxyAddHeaders, default On) then adds the real
    # X-Forwarded-For / X-Forwarded-Host. The app trusts them only with TRUSTED_PROXY=true (X-Real-IP first).
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    # The scheduler endpoint is for the local watchdog only (it calls 127.0.0.1:3000 directly).
    <Location "/api/cron/tick">
        Require all denied
    </Location>
    # Exclude ACME first (cPanel AutoSSL / certbot), then proxy everything else to the loopback-only app.
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:3000/ connectiontimeout=10 timeout=120 keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/
    # ── end B ──
</VirtualHost>
